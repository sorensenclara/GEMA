{% extends "accounts/base_auth.html" %}
{% block title %}Email enviado - GEMA{% endblock %}
{% block content %}
<div class="text-center">
    <i class="mdi mdi-email-check-outline text-success" style="font-size: 3rem;"></i>

{% endblock %}

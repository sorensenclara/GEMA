<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    /* Paleta tomada de reports/branding.py — mantener en sintonía a mano. */
    @page {
        size: A4;
        margin: 0 0 1.8cm 0;
        @bottom-center {
            content: "GEMA · página " counter(page) " de " counter(pages);
            font-size: 8pt;
            color: #1B4B8D;
        }
    }
    body {
        font-family: 'DejaVu Sans', Arial, sans-serif;
        color: #232323;
        font-size: 10pt;
        margin: 0;
    }
    .encabezado {
        display: table;
        width: 100%;
        background: #EDF5FF;
        border-bottom: 2px solid #4AC5F3;
        padding: 10px 1.5cm;
        box-sizing: border-box;
        margin: 0 0 16px;
    }
    .encabezado-logo {
        display: table-cell;
        width: 130px;
        vertical-align: middle;
    }
    .encabezado-logo img {
        max-width: 120px;
        max-height: 60px;
    }
    .encabezado-texto {
        display: table-cell;
        vertical-align: middle;
        padding-left: 12px;
    }
    .encabezado-texto h1 {
        margin: 0;
        font-size: 15pt;
        color: #1B4B8D;
    }
    .encabezado-texto p {
        margin: 2px 0 0;
        font-size: 9pt;
        color: #232323;
    }
    .tabla-informe {
        width: 90%;
        margin: 0 auto 14px;
        border-collapse: collapse;
        font-size: 9pt;
    }
    .tabla-informe thead th {
        text-align: left;
        font-weight: bold;
        font-size: 8.5pt;
        color: #1B4B8D;
        border-bottom: 2px solid #1B4B8D;
        padding: 5px 6px;
    }
    .tabla-informe tbody td {
        padding: 5px 6px;
        border-bottom: 1px solid #e0e0e0;
        vertical-align: top;
    }
    .tabla-informe thead {
        display: table-header-group;
    }
    .tabla-informe tr {
        page-break-inside: avoid;
    }
    .fila-total td {
        border-top: 2px solid #1B4B8D;
        border-bottom: none;
        font-weight: bold;
        padding-top: 8px;
    }
    .grupo-titulo {
        width: 90%;
        margin: 18px auto 4px;
        font-size: 11pt;
        font-weight: bold;
        color: #1B4B8D;
    }
    .datos-bloque {
        width: 90%;
        margin: 0 auto 14px;
        font-size: 10pt;
        line-height: 1.5;
    }
</style>
</head>
<body>
    <div class="encabezado">
        <div class="encabezado-logo"><img src="{{ logo_uri }}" alt="logo"></div>
        <div class="encabezado-texto">
            <h1>{% block titulo %}{{ titulo }}{% endblock %}</h1>
            <p>{{ empresa }}</p>
            <p>{% block subtitulo %}{% endblock %}</p>
        </div>
    </div>
    {% block content %}{% endblock %}
</body>
</html>

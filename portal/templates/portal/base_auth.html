{% load static %}<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GEMA{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'lexa/images/favicon.ico' %}">
    <link href="{% static 'lexa/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'lexa/css/icons.min.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'lexa/css/app.min.css' %}" rel="stylesheet" type="text/css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="account-pages my-5 pt-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <div class="card overflow-hidden">
                        <div class="card-body pt-0">
                            <div class="p-3">
                                <h3 class="text-center mt-4 mb-4">GEMA</h3>
                                {% block content %}{% endblock %}
                            </div>
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <p>GEMA &middot; Plataforma de gestión de matafuegos</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'lexa/libs/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'lexa/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
